name: Validate docs

# main auto-deploys to production, so gate every PR before it can merge.
on: pull_request

concurrency:
  group: validate-docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: Cytracom/common-workflows/ext/actions/checkout-v4@main
      - uses: Cytracom/common-workflows/ext/actions/setup-node-v4@main
        with:
          node-version: 20
      - run: node scripts/validate-docs.mjs
      - name: Mintlify build validation
        run: |
          npm i -g mint@4
          mint validate
          mint broken-links

  spelling:
    runs-on: ubuntu-latest
    steps:
      - uses: Cytracom/common-workflows/ext/actions/checkout-v4@main
      - uses: Cytracom/common-workflows/ext/crate-ci/typos-v1@main
