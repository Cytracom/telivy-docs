name: Docs health

# Outbound links rot silently (a hotlinked GIF host disappeared without anyone noticing),
# so sweep them weekly as well as on PRs that touch content.
on:
  schedule:
    - cron: '0 8 * * 1' # Mondays, 08:00 UTC
  workflow_dispatch:
  pull_request:
    paths:
      - '**.mdx'
      - 'docs.json'
      - '.lycheeignore'

concurrency:
  group: docs-health-${{ github.ref }}
  cancel-in-progress: true

jobs:
  stale-pages:
    # Reports only, in the run summary. Weekly, not on every PR.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: Cytracom/common-workflows/ext/actions/checkout-v4@main
        with:
          fetch-depth: 0 # report-stale.mjs reads each page's last commit date
      - uses: Cytracom/common-workflows/ext/actions/setup-node-v4@main
        with:
          node-version: 20
      - run: node scripts/report-stale.mjs

  lychee:
    runs-on: ubuntu-latest
    steps:
      - uses: Cytracom/common-workflows/ext/actions/checkout-v4@main
      - name: Check external links
        uses: Cytracom/common-workflows/ext/lycheeverse/lychee-action-v2@main
        with:
          # --root-dir resolves the site's root-relative links so the scheme filter can
          # drop them; internal links are already covered by scripts/validate-docs.mjs.
          args: >-
            --no-progress
            --root-dir /github/workspace
            --scheme https
            --scheme http
            --accept 200,206,403,429
            --max-retries 2
            --timeout 20
            './**/*.mdx'
            'docs.json'
          fail: true
          jobSummary: true
